# Replace every __PLACEHOLDER__ before enabling this production example.
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;
    root __APP_ROOT__/public;
    index index.php;

    ssl_certificate __TLS_CERTIFICATE__;
    ssl_certificate_key __TLS_PRIVATE_KEY__;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_HOST $server_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
    }

    location ~ \.php$ { return 404; }
    location ^~ /uploads/tickets/ { return 404; }
    location ~ /\. { deny all; }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

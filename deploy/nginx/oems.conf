# Replace every __PLACEHOLDER__ before enabling this production example.
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;
    root __APP_ROOT__/public;
    index index.php;

    ssl_certificate __TLS_CERTIFICATE__;
    ssl_certificate_key __TLS_PRIVATE_KEY__;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_HOST $server_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
    }

    location ~ \.php$ { return 404; }
    location ^~ /uploads/tickets/ { return 404; }
    location ~ /\. { deny all; }

    location = /service-worker.js {
        try_files $uri =404;
        default_type application/javascript;
        access_log off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /offline.html {
        try_files $uri =404;
        default_type text/html;
        access_log off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

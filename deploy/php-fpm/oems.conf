; Replace every __PLACEHOLDER__ before enabling this production example.
[oems]
user = __APP_USER__
group = __APP_GROUP__
listen = __PHP_FPM_SOCKET__
listen.owner = __WEB_USER__
listen.group = __WEB_GROUP__
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
php_admin_flag[display_errors] = off
php_admin_value[error_log] = __APP_ROOT__/storage/logs/php-fpm.log
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Lax
clear_env = no
chdir = __APP_ROOT__
